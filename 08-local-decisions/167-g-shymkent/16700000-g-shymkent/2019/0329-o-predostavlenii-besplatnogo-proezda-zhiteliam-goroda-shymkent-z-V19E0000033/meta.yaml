title:
  rus: О предоставлении бесплатного проезда жителям города Шымкент за пределы населенного пункта на лечение за счет бюджетных средств
  kaz: Шымкент қаласының тұрғындарына елді мекен шегінен тыс жерлерге емделуге бюджет қаражаты есебінен тегін жол жүруді ұсыну туралы
