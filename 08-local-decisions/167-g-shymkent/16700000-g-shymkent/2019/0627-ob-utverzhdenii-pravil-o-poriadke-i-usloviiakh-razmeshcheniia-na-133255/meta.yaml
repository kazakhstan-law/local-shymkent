  requisite: Решение маслихата города Шымкент от 14 июня 2024 года № 17/151-VIII
  title:
    rus: О внесении изменений в решение маслихата города Шымкент от 27 июня 2019 года за № 51/429-6с «Об утверждении Правил размещения наружной (визуальной) рекламы на открытом пространстве за пределами помещений в населенных пунктах, в полосе отвода автомобильных дорог общего пользования, на открытом пространстве за пределами помещений вне населенных пунктов и вне полосы отвода автомобильных дорог общего пользования на территории города Шымкент»
    kaz: «Шымкент қаласында сыртқы (көрнекі) жарнаманы елді мекендердегі үй-жайлардың шегінен тыс ашық кеңістікте, жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінде, елді мекендерден тыс жердегі үй-жайлардың шегінен тыс ашық кеңістікте және жалпыға ортақ пайдаланылатын автомобиль жолдарының бөлінген белдеуінен тыс жерде орналастыру қағидаларын бекіту туралы» Шымкент қаласы мәслихатының 2019 жылғы 27 маусымдағы № 51/429-6с шешіміне өзгерістер енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/197867/rus
