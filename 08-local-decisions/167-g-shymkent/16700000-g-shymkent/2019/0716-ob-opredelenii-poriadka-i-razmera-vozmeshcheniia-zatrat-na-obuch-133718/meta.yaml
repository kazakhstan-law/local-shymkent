  title:
    rus: О внесении изменений в решение маслихата города Шымкент от 16 июля 2019 года № 52/442-6с «Об утверждении Правил и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов города Шымкент»
    kaz: «Шымкент қаласының мүгедектер қатарындағы мүмкіндігі шектеулі балаларды үйде оқытуға жұмсалған шығындарды өтеудің Қағидалары мен мөлшерін бекіту туралы» 2019 жылғы 16 шілдедегі № 52/442-6с Шымкент қаласы мәслихатының шешiмiне өзгерістер енгізу туралы
