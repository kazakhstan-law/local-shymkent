title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей города Шымкент с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану
  kaz: Шымкент қаласының мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртiбі және мөлшерін айқындау туралы
