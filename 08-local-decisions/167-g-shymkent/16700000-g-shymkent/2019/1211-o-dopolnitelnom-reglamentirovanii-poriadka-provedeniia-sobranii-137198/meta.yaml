  title:
    rus: О внесении изменений и дополнения в решение маслихата города Шымкент от 11 декабря 2019 года № 58/508-6с «О дополнительном регламентировании порядка проведения собраний, митингов, шествий, пикетов и демонстраций и о признании утратившим силу решение Шымкентского городского маслихата от 17 марта 2016 года № 58/450-5с «О дополнительном регламентировании порядка проведения собраний, митингов, шествий, пикетов и демонстраций»»
    kaz: «Жиналыстар, митингілер, шерулер, пикеттер және демонстрациялар өткізу тәртібін қосымша реттеу туралы және «Жиналыстар, митингілер, шерулер, пикеттер және демонстрациялар өткізу тәртібін қосымша реттеу туралы» Шымкент қалалық мәслихатының 2016 жылғы 17 наурыздағы № 58/450-5с шешімінің күшін жою туралы» Шымкент қаласы мәслихатының 2019 жылғы 11 желтоқсандағы № 58/508-6с шешiмiне өзгерістер мен толықтыру енгізу туралы
