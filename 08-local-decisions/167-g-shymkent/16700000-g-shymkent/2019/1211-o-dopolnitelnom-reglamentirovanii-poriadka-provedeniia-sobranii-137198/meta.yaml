requisite: Решение маслихата города Шымкент от 11 декабря 2019 года № 58/508-6с. Зарегистрировано Департаментом юстиции города Шымкент 20 декабря 2019 года № 78. Утратило силу решением маслихата города Шымкент от 22 июня 2020 года № 67/598-6с (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном регламентировании порядка проведения собраний, митингов, шествий, пикетов и демонстраций и о признани утратившим силу решение Шымкентского городского маслихата от 17 марта 2016 года № 58/450-5с «О дополнительном регламентировании порядка проведения собраний, митингов, шествий, пикетов и демонстраций»
  kaz: Жиналыстар, митингілер, шерулер, пикеттер және демонстрациялар өткізу тәртібін қосымша реттеу туралы және «Жиналыстар, митингілер, шерулер, пикеттер және демонстрациялар өткізу тәртібін қосымша реттеу туралы» Шымкент қалалық мәслихатының 2016 жылғы 17 наурыздағы № 58/450-5с шешімінің күшін жою туралы
