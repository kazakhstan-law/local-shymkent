  title:
    rus: О внесении изменений и дополнений в решение маслихата города Шымкент от 19 марта 2024 года № 14/123-VIII «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан в городе Шымкент»
    kaz: «Шымкент қаласында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Шымкент қаласы мәслихатының 2024 жылғы 19 наурыздағы № 14/123-VIII шешiмiне өзгерістер мен толықтырулар енгізу туралы
