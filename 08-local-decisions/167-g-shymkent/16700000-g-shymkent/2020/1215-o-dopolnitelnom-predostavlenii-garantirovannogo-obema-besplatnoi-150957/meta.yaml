title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан города Шымкент при амбулаторном лечении бесплатно
  kaz: Шымкент қаласы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы
