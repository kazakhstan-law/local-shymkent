    kaz: «Шымкент қаласы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» 2020 жылғы 15 желтоқсандағы № 72/675-6с Шымкент қаласы мәслихатының шешіміне өзгерістер енгізу туралы
