  title:
    rus: О внесении изменений и дополнений в решение маслихата города Шымкент от 15 декабря 2020 года № 72/675-6с «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан города Шымкент при амбулаторном лечении бесплатно»
    kaz: «Шымкент қаласы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» 2020 жылғы 15 желтоқсандағы № 72/675-6с Шымкент қаласы мәслихатының шешіміне өзгерістер мен толықтырулар енгізу туралы
