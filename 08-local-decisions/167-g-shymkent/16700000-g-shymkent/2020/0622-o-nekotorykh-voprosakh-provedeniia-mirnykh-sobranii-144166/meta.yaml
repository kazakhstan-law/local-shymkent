  title:
    rus: О внесении изменения в решение маслихата города Шымкент от 22 июня 2020 года № 67/598-6c «Об определений специализированных мест для организации и проведения мирных собраний, порядок использования специализированных мест для организации и проведения мирных собраний и границ прилегающих территорий, в которых запрещено проведение пикетирования в городе Шымкент»
    kaz: «Шымкент қаласында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды пайдалану тәртібін және пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы» 2020 жылғы 22 маусымдағы № 67/598-6с Шымкент қаласы мәслихатының шешіміне өзгерістер енгізу туралы
